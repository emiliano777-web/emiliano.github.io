<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>conversor divisas</title>
    <link rel="stylesheet" href="css/moneda.css">
    <script src="js/moneda.js" defer></script>
</head>
<body>
    <div class="container">
        <h2>conversor multi divisa</h2>
        <input type="number" id="montoinput" placeholder="cantidad en dolares">
        <br>
        <select id="divisaselect">
            <option value="eur">euros0 (eur)</option>
            <option value="mxn">pesos mexicanos (mxn)</option>
            <option value="jpy">yenes (jap)</option>
        </select>
        <br>
        <button id="btnconvertir">calcular conversion</button>
    </div>
</body>
</html>
